<!DOCTYPE html>
<html>
<body>
<script>
const svgContent = '<svg width="100" height="100"><circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" /></svg>';
const parser = new DOMParser();
const doc = parser.parseFromString(svgContent, 'image/svg+xml');
const svgElement = doc.querySelector('svg');
console.log(svgElement ? svgElement.tagName : 'null');
if (!svgElement) process.exit(1);
</script>
</body>
</html>
